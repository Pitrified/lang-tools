{% extends "base.html" %}

{% block title %}Words – {{ app_name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <h1 class="title is-3">Word Browser</h1>
    <p class="subtitle is-5">Browse and search your vocabulary.</p>

    <div class="box mb-4">
      <div class="columns">
        <div class="column is-4">
          <div class="field">
            <label class="label is-small">Language</label>
            <div class="control">
              <div class="select is-fullwidth">
                <select id="filter-language"
                        hx-get="/words/partial"
                        hx-target="#word-table-container"
                        hx-swap="innerHTML"
                        hx-include="#filter-topic"
                        name="language">
                  <option value="">All languages</option>
                  <option value="pt" {% if language_filter == "pt" %}selected{% endif %}>Portuguese</option>
                  <option value="fr" {% if language_filter == "fr" %}selected{% endif %}>French</option>
                  <option value="es" {% if language_filter == "es" %}selected{% endif %}>Spanish</option>
                  <option value="it" {% if language_filter == "it" %}selected{% endif %}>Italian</option>
                  <option value="de" {% if language_filter == "de" %}selected{% endif %}>German</option>
                  <option value="en" {% if language_filter == "en" %}selected{% endif %}>English</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="column is-4">
          <div class="field">
            <label class="label is-small">Topic</label>
            <div class="control">
              <input id="filter-topic" class="input" type="text" name="topic"
                     placeholder="e.g. food, family"
                     value="{{ topic_filter or '' }}">
            </div>
          </div>
        </div>
        <div class="column is-4 is-flex is-align-items-flex-end">
          <button class="button is-info"
                  hx-get="/words/partial"
                  hx-target="#word-table-container"
                  hx-include="#filter-language, #filter-topic">
            Filter
          </button>
        </div>
      </div>
    </div>

    <div id="word-table-container">
      {% include "pages/words/_word_table.html" %}
    </div>
  </div>
</section>
{% endblock %}
