{% extends "base.html" %}

{% block title %}Word Detail – {{ app_name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <nav class="breadcrumb" aria-label="breadcrumbs">
      <ul>
        <li><a href="/words">Words</a></li>
        <li class="is-active"><a href="#" aria-current="page">{{ word_id }}</a></li>
      </ul>
    </nav>

    <div id="word-detail"
         hx-get="/api/v1/words/{{ word_id }}"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML">
      <p class="has-text-centered has-text-grey">Loading word details...</p>
    </div>
  </div>
</section>
{% endblock %}
