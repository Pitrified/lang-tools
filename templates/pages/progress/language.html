{% extends "base.html" %}

{% block title %}Progress – {{ language_code | upper }} – {{ app_name }}{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <nav class="breadcrumb" aria-label="breadcrumbs">
      <ul>
        <li><a href="/progress">Progress</a></li>
        <li class="is-active"><a href="#" aria-current="page">{{ language_code | upper }}</a></li>
      </ul>
    </nav>

    <h1 class="title is-3">Progress: {{ language_code | upper }}</h1>

    <div id="language-progress"
         hx-get="/api/v1/progress/{{ language_code }}"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML">
      <p class="has-text-grey">Loading language progress...</p>
    </div>
  </div>
</section>
{% endblock %}
