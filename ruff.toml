# Ruff configuration file
# https://docs.astral.sh/ruff/rules/

target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
    "COM812", # Missing trailing comma, conflict with the formatter
    "D104",   # Missing docstring in public package
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "D413",   # Missing blank line after last section
    "FIX002", # Line contains TODO, consider resolving the issue
    "RET504", # Unnecessary assignment to `value` before `return` statement
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link for this TODO
]

[lint.per-file-ignores]
# The quality-check registry interpolates internal read_parquet(...) sources
# into every query; no user input reaches the SQL (same rationale as the
# inline waivers in corpus.py).
"src/lang_tools/lexicon/quality.py" = ["S608"]
"*.ipynb" = [
    "E501",   # Line too long
    "ERA001", # Found commented-out code
    "F401",   # unused import
    "S311",   # Standard pseudo-random generators
    "T20",    # print found
    # Exploratory notebooks are prototyping scratch, not library code: do not
    # require type annotations, docstrings, or production-grade SQL/asserts.
    "ANN001", # Missing type annotation for function argument
    "ANN201", # Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D103",   # Missing docstring in public function
    "D401",   # First line of docstring should be in imperative mood
    "E402",   # Module level import not at top of file
    "I001",   # Import block is un-sorted or un-formatted
    "PLR2004", # Magic value used in comparison
    "PLW0108", # Lambda may be unnecessary
    "S101",   # Use of assert detected
    "S608",   # Possible SQL injection via string-based query construction
]
"tests/*" = [
    "ARG001", # Unused function argument: mocks and similar
    "D103",   # Missing docstring in public function
    "INP001", # File `tests/...` is part of an implicit namespace package. Add an `__init__.py`. Causes a bug.
    "PLR2004", # Magic value used in comparison, consider replacing `NUM` with a constant variable
    "S101",   # Use of assert detected
    "S311",   # Standard pseudo-random generators
]
"meta/*" = [
    "INP001", # Implicit namespace package
    "T20",    # print found
]
"scratch_space/*" = [
    "E501",   # Line too long
    "INP001", # Exploratory scripts are not a package
    "T20",    # print found (profiling / debug output)
    "S101",   # Use of assert detected
]

[lint.pylint]
max-args = 10

[lint.isort]
force-sort-within-sections = true
force-single-line = true
