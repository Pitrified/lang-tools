[project]
name = "lang-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "chroma-haystack>=2.0.1",
    "python-dotenv>=1.0",
    "haystack-ai>=2.10.0",
    "llm-core[openai] @ git+https://github.com/Pitrified/llm-core@v0.2.2",
    "loguru>=0.7.3",
    "ollama-haystack>=2.3.0",
    "openai>=1.63.0",
    "pyarrow>=18.0.0",
    "tiktoken>=0.9.0",
]

[project.optional-dependencies]
webapp = [
    "fastapi-tools @ git+https://github.com/Pitrified/fastapi-tools@v0.1.0",
]
# DuckDB powers the inspect/QA path only (`corpus.inspect_table`); the runtime
# store reads Parquet via pyarrow, which is a base dependency.
store = [
    "duckdb>=1.1.0",
]
# `wn` (Open Multilingual Wordnet access) backs the phase-5 initial-build only
# (`ingestion.acquire.download_omw` / `sources.omw`); the runtime never imports
# it, so it stays optional and lazily imported.
ingest = [
    "wn>=0.9.5",
]
# Phase-5.54 Stage-0 staging extras, all optional and lazily imported:
# `wordfreq` for the frequency lists, `xlrd` to read the legacy `.xls` Kelly CEFR
# lists (`ingestion.staging.frequency` / `.cefr`).
enrich = [
    "wordfreq>=3.0.0",
    "xlrd>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lang_tools"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "notebook" },
    { include-group = "test" },
]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=1.3.0",
]
lint = [
    "ruff>=0.9.6",
    "pyright[nodejs]>=1.1.407",
    "pre-commit>=4.1.0",
    "detect-secrets>=1.5.0",
]
notebook = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "nbformat>=5.10.4",
    "nbstripout>=0.8.2",
    "rich>=13.9.4",
    "tqdm>=4.67.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-api-autonav>=0.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
# remember to adjust include paths as needed (eg scripts folder)
include = ["src", "tests"]
